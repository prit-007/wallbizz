name: vivek_app
description: "Wallbizz — Premium curated wallpapers powered by Wallhaven"
publish_to: 'none'
version: 1.0.0+2002

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Layout
  flutter_staggered_grid_view: ^0.7.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.1.0

  # Image Fetching & Caching
  cached_network_image: ^3.3.1
  octo_image: ^2.0.0

  # Cropping & Setting
  image_cropper: ^12.2.1
  async_wallpaper: ^3.1.0
  url_launcher: ^6.2.4
  share_plus: ^10.1.4

  # State & Database
  supabase_flutter: ^2.5.0
  shared_preferences: ^2.2.2
  http: ^1.2.0

  # Local Storage (Downloads)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Downloads
  path_provider: ^2.1.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
