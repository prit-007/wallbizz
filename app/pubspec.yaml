name: vivek_app
description: "Premium wallpaper app powered by Wallhaven"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Layout
  flutter_staggered_grid_view: ^0.7.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.1.0

  # Image Fetching & Caching
  cached_network_image: ^3.3.1
  octo_image: ^2.0.0

  # Cropping & Setting
  image_cropper: ^5.0.1
  flutter_wallpaper_manager: ^0.0.2
  url_launcher: ^6.2.4

  # State & Database
  supabase_flutter: ^2.5.0
  shared_preferences: ^2.2.2
  http: ^1.2.0

  # Environment
  flutter_dotenv: ^5.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
