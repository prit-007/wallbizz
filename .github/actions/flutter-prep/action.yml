name: Flutter prep
description: Install deps and setup env. Shared by all CI jobs.

inputs:
  supabase-url:
    description: 'Supabase URL'
    required: false
    default: ''
  supabase-anon-key:
    description: 'Supabase anon key'
    required: false
    default: ''
  backend-url:
    description: 'Backend URL'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Create .env
      shell: bash
      working-directory: app
      env:
        SV_SUPABASE_URL: ${{ inputs.supabase-url }}
        SV_SUPABASE_ANON_KEY: ${{ inputs.supabase-anon-key }}
        SV_BACKEND_URL: ${{ inputs.backend-url }}
      run: |
        printf '# Supabase\nSUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n\n# Backend (for web image proxy)\nBACKEND_URL=%s\n' \
          "$SV_SUPABASE_URL" "$SV_SUPABASE_ANON_KEY" "$SV_BACKEND_URL" > .env
        echo "Created .env:"
        cat .env

    - name: Install dependencies
      shell: bash
      working-directory: app
      run: flutter pub get

    - name: Extract App Version
      shell: bash
      working-directory: app
      run: |
        VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r' | sed -E 's/\+[0-9]+$//')
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
        echo "Resolved version: $VERSION"
