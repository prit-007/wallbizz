name: Flutter prep
description: Install deps and setup env. Shared by all CI jobs.

inputs:
  supabase-url:
    description: 'Supabase URL'
    required: false
    default: ''
  supabase-anon-key:
    description: 'Supabase anon key'
    required: false
    default: ''
  backend-url:
    description: 'Backend URL'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Create .env
      shell: bash
      working-directory: app
      run: |
        if [ ! -f .env.example ]; then
          echo "ERROR: .env.example not found — cannot create .env"
          exit 1
        fi
        cp .env.example .env
        if [ -n "${{ inputs.supabase-url }}" ]; then
          sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=${{ inputs.supabase-url }}|" .env
        fi
        if [ -n "${{ inputs.supabase-anon-key }}" ]; then
          sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=${{ inputs.supabase-anon-key }}|" .env
        fi
        if [ -n "${{ inputs.backend-url }}" ]; then
          sed -i "s|^BACKEND_URL=.*|BACKEND_URL=${{ inputs.backend-url }}|" .env
        fi
        echo "Created .env:"
        cat .env

    - name: Install dependencies
      shell: bash
      working-directory: app
      run: flutter pub get

    - name: Extract App Version
      shell: bash
      working-directory: app
      run: |
        VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r' | sed -E 's/\+[0-9]+$//')
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
        echo "Resolved version: $VERSION"
