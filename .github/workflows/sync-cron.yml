name: Sync Wallpapers

on:
  schedule:
    - cron: '0 2,14 * * *'  # 2 AM and 2 PM UTC daily
  workflow_dispatch:         # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        run: |
          HTTP_CODE=$(curl -s -o /tmp/sync_response.txt -w "%{http_code}" -X POST "${{ secrets.BACKEND_URL }}/api/v1/sync" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat /tmp/sync_response.txt
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Sync trigger failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Sync triggered successfully (HTTP $HTTP_CODE)"

      - name: Wait for sync to complete
        run: sleep 30

      - name: Verify health
        run: |
          curl -sf "${{ secrets.BACKEND_URL }}/api/v1/health" || {
            echo "Health check failed"
            exit 1
          }
