name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Run tests
        run: go test ./... -v -race -count=1
      - name: Build
        run: go build -o /dev/null .

  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Create .env from example
        working-directory: app
        run: cp .env.example .env
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        working-directory: app
        run: flutter test

  build-android:
    needs: [backend, analyze-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Create .env from example
        working-directory: app
        run: cp .env.example .env
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Build split APKs
        working-directory: app
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/app-x86_64-release.apk

  build-ios:
    needs: [backend, analyze-and-test]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Create .env from example
        working-directory: app
        run: cp .env.example .env
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Build iOS (no codesign)
        working-directory: app
        run: flutter build ios --release --no-codesign
      - name: Zip iOS build
        run: cd app/build/ios/iphoneos && zip -r ../../../ios-build.zip Runner.app
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: app/ios-build.zip

  build-windows:
    needs: [backend, analyze-and-test]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Create .env from example
        working-directory: app
        run: cp .env.example .env
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Build Windows
        working-directory: app
        run: flutter build windows --release
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: app/build/windows/x64/runner/Release

  build-web:
    needs: [backend, analyze-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Create .env from example
        working-directory: app
        run: cp .env.example .env
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Build web
        working-directory: app
        run: flutter build web --release
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/build/web

  build-backend:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t wallbizz-backend ./backend
      - name: Export image
        run: docker save wallbizz-backend | gzip > backend-image.tar.gz
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-ios, build-windows, build-web, build-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: artifacts/android
      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: artifacts/ios
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: artifacts/web
      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: artifacts
      - name: Extract release notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          NOTES=$(awk "/^## $TAG/{found=1; next} /^## [0-9]/{if(found) exit} found{print}" CHANGELOG.md 2>/dev/null || echo "Release $TAG")
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: |
            artifacts/android/*.apk
            artifacts/ios/ios-build.zip
            artifacts/windows/*
            artifacts/backend-image.tar.gz
          draft: false
          prerelease: false
