name: CI & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test ./... -v -race -count=1
      - run: go build -o /dev/null .

  # ── Flutter analyze & test ──────────────────────────────────────────
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: ./.github/actions/flutter-prep
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          backend-url: ${{ secrets.BACKEND_URL }}
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: app
      - run: flutter analyze --no-fatal-infos
        working-directory: app
      - run: flutter test
        working-directory: app

  # ── Android (signed via GitHub Secrets) ──────────────────────────────
  build-android:
    needs: [backend, analyze-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: ./.github/actions/flutter-prep
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          backend-url: ${{ secrets.BACKEND_URL }}

      - name: Decode keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/android/app/wallbizz.keystore

      - name: Configure release signing
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: app
        run: |
          {
            echo "storeFile=wallbizz.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build ARM APK
        working-directory: app
        run: |
          flutter build apk --release --target-platform=android-arm --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Build ARM64 APK
        working-directory: app
        run: |
          flutter build apk --release --target-platform=android-arm64 --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Build x86_64 APK
        working-directory: app
        run: |
          flutter build apk --release --target-platform=android-x64 --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wallbizz-apks
          path: app/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  # ── iOS ──────────────────────────────────────────────────────────────
  build-ios:
    needs: [backend, analyze-and-test]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: ./.github/actions/flutter-prep
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          backend-url: ${{ secrets.BACKEND_URL }}

      - name: Build release iOS (unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package iOS build
        working-directory: app
        run: |
          cd build/ios/iphoneos
          zip -r ../wallbizz-ios-v${{ env.APP_VERSION }}.zip Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallbizz-ios
          path: app/build/ios/wallbizz-ios-v${{ env.APP_VERSION }}.zip
          if-no-files-found: error

  # ── Windows ──────────────────────────────────────────────────────────
  build-windows:
    needs: [backend, analyze-and-test]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: ./.github/actions/flutter-prep
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          backend-url: ${{ secrets.BACKEND_URL }}

      - name: Build release Windows
        working-directory: app
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        working-directory: app
        shell: powershell
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          dart run tool/build_installer.dart --iscc $iscc

      - name: Verify installer
        working-directory: app
        shell: powershell
        run: |
          $exe = Get-ChildItem build/installers/wallbizz_setup_*.exe
          if (-not $exe) { throw "Installer .exe was not produced" }
          Write-Host "Installer: $($exe.FullName)"

      - name: Package Windows build
        working-directory: app
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "wallbizz-windows-v${{ env.APP_VERSION }}.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallbizz-windows
          path: |
            app/wallbizz-windows-v${{ env.APP_VERSION }}.zip
            app/build/installers/wallbizz_setup_*.exe
          if-no-files-found: error

  # ── Linux ────────────────────────────────────────────────────────────
  build-linux:
    needs: [backend, analyze-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgtk-3-dev libsecret-1-dev
      - uses: ./.github/actions/flutter-prep
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          backend-url: ${{ secrets.BACKEND_URL }}

      - name: Build release Linux
        working-directory: app
        run: flutter build linux --release

      - name: Package Linux build
        working-directory: app
        run: |
          tar -czf wallbizz-linux-v${{ env.APP_VERSION }}.tar.gz \
            -C build/linux/x64/release bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallbizz-linux
          path: app/wallbizz-linux-v${{ env.APP_VERSION }}.tar.gz
          if-no-files-found: error

  # ── macOS ────────────────────────────────────────────────────────────
  build-macos:
    needs: [backend, analyze-and-test]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: ./.github/actions/flutter-prep
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          backend-url: ${{ secrets.BACKEND_URL }}

      - name: Build release macOS (unsigned)
        working-directory: app
        run: flutter build macos --release

      - name: Package macOS build
        working-directory: app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Wallbizz.app \
            wallbizz-macos-v${{ env.APP_VERSION }}.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallbizz-macos
          path: app/wallbizz-macos-v${{ env.APP_VERSION }}.zip
          if-no-files-found: error

  # ── Web ──────────────────────────────────────────────────────────────
  build-web:
    needs: [backend, analyze-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: ./.github/actions/flutter-prep
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          backend-url: ${{ secrets.BACKEND_URL }}

      - name: Build release web
        working-directory: app
        run: flutter build web --release

      - name: Verify .env in build output
        working-directory: app
        run: |
          if [ ! -f build/web/assets/.env ]; then
            echo "WARN: .env missing from build output — copying from source"
            cp .env build/web/assets/.env
          fi

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallbizz-web
          path: app/build/web

  # ── Backend Docker ───────────────────────────────────────────────────
  build-backend:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wallbizz-backend ./backend
      - run: docker save wallbizz-backend | gzip > backend-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: wallbizz-backend
          path: backend-image.tar.gz

  # ── Release (tag pushes only) ───────────────────────────────────────
  release:
    needs: [build-android, build-ios, build-windows, build-linux, build-macos, build-web, build-backend]
    if: startsWith(github.ref, 'refs/tags/') &&
        !cancelled() &&
        needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download Android artifacts
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: wallbizz-apks
          path: release/apks

      - name: Download Windows artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: wallbizz-windows
          path: release/windows

      - name: Download iOS artifact
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: wallbizz-ios
          path: release/ios

      - name: Download macOS artifact
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: wallbizz-macos
          path: release/macos

      - name: Download Linux artifact
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: wallbizz-linux
          path: release/linux

      - name: Download backend image
        if: needs.build-backend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: wallbizz-backend
          path: release

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          awk -v ver="[$VERSION]" '
            /^## \[/ {
              if (index($0, "## " ver) == 1) { on = 1; print; next }
              if (on) exit
            }
            on
          ' CHANGELOG.md > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          allowUpdates: true
          update_release_body: true
          files: |
            release/apks/**/*.apk
            release/windows/**/*.zip
            release/windows/**/*.exe
            release/ios/**/*.zip
            release/macos/**/*.zip
            release/linux/**/*.tar.gz
            release/backend-image.tar.gz
          name: Release ${{ github.ref_name }}
