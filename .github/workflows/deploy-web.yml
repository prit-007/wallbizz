name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable

      - name: Setup env
        working-directory: app
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" >> .env

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Flutter web
        working-directory: app
        run: flutter build web --release

      - name: Prepare deploy directory
        run: |
          mkdir -p /tmp/pages-deploy/app

          # Flutter output to /app/
          cp -r app/build/web/* /tmp/pages-deploy/app/

          # Fetch gh-pages branch and extract landing page
          git fetch origin gh-pages:gh-pages
          git show gh-pages:index.html > /tmp/pages-deploy/index.html

          # Fix base href for Flutter subdirectory
          sed -i 's|<base href="/"|<base href="/wallbizz/app/"|g' /tmp/pages-deploy/app/index.html

          # Fix manifest.json paths
          if [ -f /tmp/pages-deploy/app/manifest.json ]; then
            sed -i 's|"/"|"/wallbizz/app/"|g' /tmp/pages-deploy/app/manifest.json
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/pages-deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
